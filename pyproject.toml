[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-harness"
version = "0.1.0"
description = "A minimal educational agent harness inspired by Hermes Agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.21,<5.0",
    "PyYAML>=6.0,<7.0",
]

[project.scripts]
mini-harness = "mini_harness.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
